<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>V-MAX Omni-Architect</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
      
      :root {
        --ui-border: #cbd5e1; /* slate-300 */
        --ui-bg: #ffffff;
        --ui-shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --ui-shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        --ui-shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
      }

      body {
        font-family: 'Noto Sans TC', sans-serif;
        background-color: #f8fafc; 
        color: #0f172a; 
        overflow: hidden; 
      }

      /* 自訂捲軸：極簡清爽 */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

      .glass-panel { background: var(--ui-bg); border: 1px solid var(--ui-border); box-shadow: var(--ui-shadow-md); }
      .glass-card { background: var(--ui-bg); border: 1px solid var(--ui-border); transition: all 0.2s; }
      .glass-card:hover { transform: translateY(-2px); box-shadow: var(--ui-shadow-hover); }
    </style>
  </head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script> 
</body>
</html>
